<!-- ---- Add Farm Form ---- -->
<section class="panel">
<div class="panel-header">
<h2>Register New Farm</h2>
</div>
<form action="#" method="POST">
<div class="form-grid">
<div class="form-group">
<label for="farmer_id">Farmer</label>
<select id="farmer_id" name="farmer_id" required>
<option value="">-- Select Farmer --</option>
<option value="1">Grace Nabirye</option>
<option value="2">Peter Okello</option>
</select>
</div>
<div class="form-group">
<label for="farm_name">Farm Name</label>
<input type="text" id="farm_name" name="farm_name" required>
</div>
<div class="form-group">
<label for="location">Location</label>
<input type="text" id="location" name="location" required>
</div>
<div class="form-group">
<label for="size_in_acres">Size (Acres)</label>
<input type="number" step="0.01" id="size_in_acres" name="size_in_acres">
</div>
<div class="form-group">
<label for="soil_type">Soil Type</label>
<select id="soil_type" name="soil_type">
<option value="Loam">Loam</option>
<option value="Clay">Clay</option>
<option value="Sandy">Sandy</option>
<option value="Silt">Silt</option>
